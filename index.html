<!DOCTYPE html>
<html lang="en">

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

      min-height: 100vh;

      background: #d8c8b3;

      color: #4d2f1d;

    .hero {

      background-repeat: no-repeat;

    .scroll-cue {

      right: 16px;
      bottom: 66px;
      left: 16px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.75);

      font-size: 1.7rem;
      line-height: 1;
    }

      color: #4d2f1d;
      padding: clamp(20px, 5vw, 30px);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(41, 30, 20, 0.2);

      font-weight: 400;

      letter-spacing: 1px;
    }

      font-family: 'Cormorant Garamond', 'Georgia', serif;

    }

      font-size: 16px;
      margin: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      letter-spacing: 0.08em;

      margin-top: 5px;
      margin-bottom: 15px;

    }
    .submit-btn {

      color: white;
      width: 100%;
    }

      .hero {

        min-height: 100svh;

      }

        font-size: 1rem;

      h3 { font-size: clamp(1.8rem, 8vw, 2.3rem); }
      h4 { font-size: 1rem; }

        </select>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="">Choose your country</option>
        </select>
        <p class="field-hint">Countries are listed alphabetically.</p>

        <label for="phoneCountryCode">Country Code</label>
        <select id="phoneCountryCode" name="phoneCountryCode">
          <option value="">Choose a calling code</option>
        </select>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="555 123 4567">

        <label for="guests">Number of Guests (Excluding Yourself)</label>
        <input type="number" id="guests" name="guests" min="0" value="1">

        <label for="guestNames">Name Your Guests (Full Name)</label>
        <textarea id="guestNames" name="guestNames" rows="2"></textarea>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3"></textarea>

        <label for="allergies">Allergies</label>
        <textarea id="allergies" name="allergies" rows="2"></textarea>

        <button type="submit" id="submitBtn" class="submit-btn">Send Response</button>
      </form>

      <p id="statusMessage" style="display:none; text-align: center; margin-top: 15px;"></p>
    </div>
  </div>

    function populateCountries() {
      countrySelect.replaceChildren(new Option('Choose your country', ''));
      countries.forEach(country => countrySelect.add(new Option(country, country)));

      phoneCountryCode.replaceChildren(new Option('Choose a country code', ''));
      countries.forEach(country => {
        const callingCode = countryCallingCodes[country];
        phoneCountryCode.add(new Option(`${country} (+${callingCode})`, `+${callingCode}`));
      });
    }

    populateCountries();
    countrySelect.addEventListener('change', () => {
      const countryIndex = countries.indexOf(countrySelect.value);
      phoneCountryCode.selectedIndex = countryIndex < 0 ? 0 : countryIndex + 1;
    });

    // 2. Form submit handler that sends the data to your Google Sheet
    form.addEventListener('submit', e => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'Sending...';

      const formData = {
        name: form.name.value,
        attending: attendingChoice.value,
        country: form.country.value,
        phoneCountryCode: form.phoneCountryCode.value,
        phone: form.phone.value
          ? `(${form.phoneCountryCode.value}) ${form.phone.value}`.trim()
          : '',
        guests: form.guests.value,
        guestNames: form.guestNames.value,
        notes: form.notes.value,
        allergies: form.allergies.value
      };

        method: 'POST',
        mode: 'no-cors',
